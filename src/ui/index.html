<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>__AGENT_NAME__</title>
  <link rel="stylesheet" href="xterm.css" />
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
    #terminal { width: 100vw; height: 100vh; padding: 4px; box-sizing: border-box; }
    .xterm-viewport { background: #000 !important; }

    /* Hide xterm's scrollbar but keep wheel/keyboard scroll. */
    .xterm-viewport::-webkit-scrollbar { display: none; }
    .xterm-viewport { scrollbar-width: none; -ms-overflow-style: none; }
  </style>
</head>
<body>
  <div id="terminal"></div>
  <script src="xterm.js"></script>
  <script src="addon-fit.js"></script>
  <script src="addon-clipboard.js"></script>
  <script>
    const isMac = /Mac|iPod|iPhone|iPad/.test(navigator.platform);

    const term = new Terminal({
      cursorBlink: true,
      fontFamily: 'ui-monospace, SFMono-Regular, Menlo, Consolas, monospace',
      fontSize: 14,
      scrollback: 5000,
      theme: {
        background: '#000000',
        foreground: '#ffffff',
        selectionBackground: '#4d4d4d',
        selectionForeground: '#ffffff',
        selectionInactiveBackground: '#2d2d2d',
      },
    });

    const fit = new FitAddon.FitAddon();
    term.loadAddon(fit);
    // OSC 52: lets programs in the terminal (the agent CLI, vim, fzf, ...) push
    // text to the system clipboard via escape sequences.
    term.loadAddon(new ClipboardAddon.ClipboardAddon());

    // Copy/paste keybindings.
    //
    // Copy:
    //  - Ctrl+C with a non-empty selection (smart copy, VS-Code style). With no
    //    selection it falls through to the agent as SIGINT.
    //  - Ctrl+Insert (X11 convention; never conflicts with the browser).
    //  - Cmd+C on Mac with a selection.
    //
    // Paste:
    //  - Ctrl+Shift+V (works in Chrome/Firefox; not a reserved shortcut).
    //  - Shift+Insert (X11 convention).
    //  - Cmd+V on Mac.
    //
    // Ctrl+Shift+C is deliberately not bound — Chrome and Firefox reserve it for
    // DevTools and intercept it before any page handler runs.
    term.attachCustomKeyEventHandler((e) => {
      if (e.type !== 'keydown') return true;

      const ctrlCopy   = e.code === 'KeyC'   && e.ctrlKey && !e.shiftKey && !e.metaKey && !e.altKey;
      const insertCopy = e.code === 'Insert' && e.ctrlKey && !e.shiftKey && !e.metaKey && !e.altKey;
      const macCopy    = isMac && e.code === 'KeyC' && e.metaKey && !e.ctrlKey && !e.shiftKey && !e.altKey;
      if (ctrlCopy || insertCopy || macCopy) {
        const sel = term.getSelection();
        if (sel) {
          navigator.clipboard.writeText(sel).catch((err) => console.warn('clipboard write failed:', err));
          term.clearSelection();
          return false;
        }
      }

      const ctrlShiftPaste = e.code === 'KeyV'   && e.ctrlKey && e.shiftKey && !e.metaKey && !e.altKey;
      const insertPaste    = e.code === 'Insert' && e.shiftKey && !e.ctrlKey && !e.metaKey && !e.altKey;
      const macPaste       = isMac && e.code === 'KeyV' && e.metaKey && !e.ctrlKey && !e.shiftKey && !e.altKey;
      if (ctrlShiftPaste || insertPaste || macPaste) {
        navigator.clipboard.readText()
          .then((text) => { if (text) term.paste(text); })
          .catch((err) => console.warn('clipboard read failed:', err));
        return false;
      }

      return true;
    });

    term.open(document.getElementById('terminal'));
    fit.fit();

    // Tab title: '<agent>' when idle, '✦ <agent>' when the agent wants input.
    // A TUI rings BEL when it finishes responding and is ready for input, so a
    // bell means waiting-on-user. Any keypress flips back to idle, since the
    // user is now driving. Harmless for a harness that never rings.
    const AGENT_NAME = '__AGENT_NAME__';
    const GLYPH_WAITING = '✦';
    let waiting = false;
    function renderTitle() {
      document.title = waiting ? `${GLYPH_WAITING} ${AGENT_NAME}` : AGENT_NAME;
    }
    renderTitle();
    term.onBell(() => { waiting = true; renderTitle(); });

    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    // Resolved against the current path so the terminal works when the ingress
    // mounts the agent under a sub-path rather than at the root.
    const wsUrl = new URL('__WS_PATH__', location.href);
    wsUrl.protocol = `${proto}:`;
    const ws = new WebSocket(wsUrl);
    ws.binaryType = 'arraybuffer';

    function sendResize() {
      fit.fit();
      if (ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'resize', cols: term.cols, rows: term.rows }));
      }
    }

    ws.onopen = sendResize;
    ws.onmessage = (ev) => {
      if (typeof ev.data === 'string') term.write(ev.data);
      else term.write(new Uint8Array(ev.data));
    };
    ws.onclose = () => {
      term.write('\r\n\x1b[31m[connection closed]\x1b[0m\r\n');
    };

    term.onData((data) => {
      if (waiting) { waiting = false; renderTitle(); }
      if (ws.readyState === WebSocket.OPEN) ws.send(data);
    });

    window.addEventListener('resize', sendResize);
  </script>
</body>
</html>
