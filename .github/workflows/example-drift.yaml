name: Adapter Example Drift

# `examples/claude-code/` and `examples/opencode/` are the adapters' real
# runtime.json and emit.mjs, not illustrations. They are the authoring reference
# the docs point at, the source the CI fixture adapter is built from, and what
# the emitted goldens are generated against — so a copy that quietly falls
# behind its adapter makes all three lie at once.
#
# Nothing in git ties the two together, so this watches them. It is the same
# shape as schema-drift.yaml, and for the same reason: the thing being checked
# lives in another repository and can change without anyone here noticing.
#
# The pull_request path filter is deliberate. A change in an adapter repo must
# not turn unrelated PRs here red; a scheduled failure is the notification, and
# a PR that touches examples/ is the thing worth gating.

on:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - 'examples/**'

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compare each example against its adapter's main
        run: |
          status=0
          check() {
            example="examples/$1"
            repo="$2"
            for file in runtime.json emit.mjs; do
              url="https://raw.githubusercontent.com/language-operator/${repo}/main/${file}"
              if ! curl -fsSL --retry 3 --retry-delay 2 --retry-all-errors -o /tmp/upstream "$url"; then
                echo "::error::could not fetch ${repo}/${file} from ${url}"
                status=1
                continue
              fi
              if diff -u /tmp/upstream "${example}/${file}" \
                   --label "${repo}/${file} (main)" --label "${example}/${file}"; then
                echo "ok    ${example}/${file} matches ${repo}"
              else
                echo "::error::${example}/${file} has drifted from ${repo}/${file} on main. Whichever side is correct, both must end up the same — the docs, the CI fixture adapter and the emitted goldens all read the copy in this repo."
                status=1
              fi
            done
          }

          check claude-code claude-code-adapter
          check opencode    opencode-adapter
          exit "$status"
