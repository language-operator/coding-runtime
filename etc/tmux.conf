# /etc/tmux.conf — configuration for the coding-runtime web terminal.
#
# Invoked as `tmux -f /etc/tmux.conf new-session -A -s <session> <launch>`. The
# goal is for the browser terminal to look exactly like a plain harness session,
# with tmux invisible underneath, providing only session persistence across
# reconnects and pod-local restarts.

# No tmux chrome — the user should never know it is there.
set -g status off
set -g default-terminal "xterm-256color"
set -g history-limit 50000

# When clients of different sizes attach, size to the largest rather than
# constraining everyone to the smallest viewport.
set -g window-size largest

# tmux's own mouse handling would intercept selection and break the browser's
# Shift-drag select and clipboard shortcuts. Pass mouse events through.
set -g mouse off
