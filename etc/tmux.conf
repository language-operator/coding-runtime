# /etc/tmux.conf — configuration for the coding-runtime web terminal.
#
# Invoked as `tmux -f /etc/tmux.conf new-session -A -s <session> <launch>`. The
# goal is for the browser terminal to look exactly like a plain harness session,
# with tmux invisible underneath, providing only session persistence across
# reconnects and pod-local restarts.

# No tmux chrome — the user should never know it is there.
set -g status off
set -g default-terminal "xterm-256color"
set -g history-limit 50000

# When clients of different sizes attach, size to the largest rather than
# constraining everyone to the smallest viewport.
set -g window-size largest

# tmux's own mouse handling would intercept selection and break the browser's
# Shift-drag select and clipboard shortcuts. Pass mouse events through.
set -g mouse off

# Let modified Enter through to the harness. Without this tmux reports
# Shift+Enter, Ctrl+Enter and Enter as the same key, so a TUI that treats
# Shift+Enter as "newline, don't submit" cannot see the difference — and pi warns
# about it on every start.
#
# `on`, not `always`: tmux then forwards extended keys only to an application
# that asked for them. Plain Enter still arrives as plain Enter for everything
# else, which is what keeps claude-code and opencode unaffected. Under `always`
# tmux would push CSI-u sequences at harnesses that never requested them, and a
# harness which does not understand them drops the key entirely.
#
# No `extended-keys-format csi-u` here: that option arrived in tmux 3.5 and this
# base is Debian bookworm, which ships 3.3a. Setting it from a config loaded with
# `-f` fails *silently* — the server still starts and later lines still apply —
# so it would read as working while doing nothing. Add it if the base moves to a
# release with tmux >= 3.5.
#
# Note this alone does not fix the web terminal: xterm.js sends plain CR for
# Shift+Enter, so the browser never sends anything tmux could tell apart. That
# half is tracked separately.
set -g extended-keys on
